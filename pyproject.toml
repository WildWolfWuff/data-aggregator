[project]
name = "aggregator"
version = "0.1.0"
description = "Core runtime for the Data Aggregator"
readme = "README.md"
authors = [
    { name = "WildWolfWuff", email = "mhummel@wildwolfwuff.de" }
]
requires-python = ">=3.14"


[dependency-groups]

dev = [
    "data-aggregator",
    "data-aggregator-cli",
    "data-aggregator-core",
    "data-aggregator-provider-core",
    "data-aggregator-provider-file",
    "data-aggregator-provider-grpc",
    "data-aggregator-provider-http",
    "data-aggregator-provider-sql",
    "data-aggregator-server",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.0",
    "ty>=0.0.86",
]

[tool.uv]
default-groups = ["dev"]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
data-aggregator = { workspace = true }
data-aggregator-cli = { workspace = true }
data-aggregator-core = { workspace = true }
data-aggregator-provider-core = { workspace = true }
data-aggregator-provider-file = { workspace = true }
data-aggregator-provider-grpc = { workspace = true }
data-aggregator-provider-http = { workspace = true }
data-aggregator-provider-sql = { workspace = true }
data-aggregator-server = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py314"
indent-width = 2


src = ["packages/*/src", "packages/*/tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E111", "E116"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "E111", "E116"]

[tool.ty.environment]
python-version = "3.14"

[tool.ty.terminal]
error-on-warning = true

[tool.pytest.ini_options]
testpaths = ["src"]
addopts = "-ra --strict-markers --strict-config --import-mode=importlib"
