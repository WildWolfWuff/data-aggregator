[project]
name = "aggregator"
version = "0.1.0"
description = "Core runtime for the Data Aggregator"
readme = "README.md"
authors = [
    { name = "WildWolfWuff", email = "mhummel@wildwolfwuff.de" }
]
requires-python = ">=3.14"

[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
    "data-aggregator",
    "data-aggregator-cli",
    "data-aggregator-core",
    "data-aggregator-provider-core",
    "click>=8.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-asyncio>=1.4.1",
    "pre-commit>=4.0.0",
    "ruff>=0.17.0",
    "ty>=0.0.92",
]

[tool.uv]
default-groups = ["dev"]

[tool.uv.sources]
data-aggregator = { workspace = true }
data-aggregator-cli = { workspace = true }
data-aggregator-core = { workspace = true }
data-aggregator-provider-core = { workspace = true }


[tool.ruff]
line-length = 120
indent-width = 2
target-version = "py314"
src = ["packages/*/src", "packages/*/tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E111", "E116"]
[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "E111", "E116"]

[tool.ty.environment]
python-version = "3.14"

[tool.ty.terminal]
error-on-warning = true

[tool.pytest.ini_options]
testpaths = ["packages/**/tests"]
addopts = "-ra --strict-markers --strict-config --import-mode=importlib"
asyncio_default_fixture_loop_scope = "function"