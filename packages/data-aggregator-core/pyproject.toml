[project]
name = "data-aggregator-core"
version = "0.1.0"
description = "Shared configuration and utilities for Data Aggregator src"
requires-python = ">=3.14"
authors = [
    { name = "WildWolfWuff", email = "mhummel@wildwolfwuff.de" }
]
dependencies = [
    "pydantic>=2.14.1",
    "pydantic-settings[toml,yaml]>=2.15.0",
]

[tool.ruff]
extend = "../../pyproject.toml"

[build-system]
requires = ["uv_build>=0.13.0,<0.14"]
build-backend = "uv_build"
