[project]
name = "data-aggregator-core"
version = "0.1.0"
description = "Shared configuration and utilities for Data Aggregator packages"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.14.1",
    "pydantic-settings[toml,yaml]>=2.16.0",
]

[tool.ruff]
extend = "../../pyproject.toml"

[tool.uv]
package = true

[tool.uv.build-backend]
module-name = "data_aggregator.core"


[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"
