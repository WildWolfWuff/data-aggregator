[project]
name = "data-aggregator-provider-file"
version = "0.1.0"
description = "Local file provider for Data Aggregator"
requires-python = ">=3.14"
dependencies = [
    "data-aggregator-provider-core",
]
[project.entry-points."data_aggregator_providers_file"]
file = "data_aggregator_providers_file:FileProvider"
[tool.uv.sources]
data-aggregator-provider-core = { workspace = true }

[build-system]
requires = ["uv_build>=0.13.0,<0.14"]
build-backend = "uv_build"
