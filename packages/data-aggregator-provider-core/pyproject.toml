[project]
name = "data-aggregator-provider-core"
version = "0.1.0"
description = "Shared configuration and utilities for Data Aggregator packages"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "data-aggregator-core",
    "httpx2>=2.16.0",
    "pandas>=3.1.0",
    "pydantic>=2.14.1",
    "pydantic-settings[toml,yaml]>=2.16.0",
]

[tool.ruff]
extend = "../../pyproject.toml"

[tool.uv.sources]
data-aggregator-core = { workspace = true }

[tool.uv]
package = true

[tool.uv.build-backend]
module-name = "data_aggregator.provider"


[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"
