[project]
name = "data-aggregator-cli"
version = "0.1.0"
description = "Command-line interface for Data Aggregator"
requires-python = ">=3.14"
dependencies = [
    "data-aggregator",
]

[project.scripts]
data-aggregator = "data_aggregator.cli:main"

[tool.ruff]
extend = "../../pyproject.toml"

[tool.uv.sources]
data-aggregator = { workspace = true }

[tool.uv.build-backend]
module-name = "data_aggregator.cli"

[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"
